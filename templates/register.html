{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-12 col-sm-9 col-md-7 col-lg-5">
        <div class="card shadow border-0 p-3">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary m-0">Registrasi Mahasiswa</h3>
                    <p class="small text-muted">Lengkapi data diri Anda untuk membuat akun absensi</p>
                </div>

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold text-secondary">NIM</label>
                            <input type="text" name="nim" class="form-control" placeholder="Contoh: 21001012" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold text-secondary">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Username login" required autocomplete="off">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">Nama Lengkap</label>
                        <input type="text" name="nama_lengkap" class="form-control" placeholder="Nama lengkap sesuai KTM" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Buat password aman" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 shadow-sm fw-bold">Daftar Sekarang</button>
                </form>

                <div class="text-center mt-3">
                    <p class="small text-muted mb-0">Sudah punya akun? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Login di sini</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
